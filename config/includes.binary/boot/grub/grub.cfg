# Os marcadores KERNEL, INITRD e PRETTY_NAME (entre @) são substituídos na build
# pelo hook config/hooks/normal/02-grub.hook.binary

set default=0
set timeout=10

menuentry "@PRETTY_NAME@ (Live)" {
    linux @KERNEL@ boot=live components locales=pt_BR.UTF-8
    initrd @INITRD@
}

menuentry "@PRETTY_NAME@ (Fail-safe)" {
    linux @KERNEL@ boot=live components locales=pt_BR.UTF-8 memtest noapic noapm nodma nomce nolapic nosmp nosplash vga=normal
    initrd @INITRD@
}
